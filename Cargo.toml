[workspace]
resolver = "2"
members = [
    "crates/evox-core",
    "crates/evox-runtime",
    "crates/evox-state",
    "crates/evox-crypto",
]

# This section is for managing versions and shared dependencies across the entire project.
[workspace.package]
version = "0.1.0"
authors = ["EvoX Team"]
edition = "2021"
description = "EvoX High-Performance Blockchain Infrastructure"

[workspace.dependencies]
# Here we define dependencies that are common to all modules
# For example, in the future if we want to use Tokio for networking, we add it here

# 1. Async Runtime: بهترین در کلاس خود برای شبکه و موازی‌سازی
tokio = { version = "1.36", features = ["full"] }

# 2. Serialization: استاندارد غیرقابل‌انکار برای بلاکچین (بسیار سریع)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"  # برای سریالیزاسیون باینری که در شبکه سریع‌تر از JSON است

# 3. Error Handling: برای مدیریت خطاهای تمیز و حرفه‌ای
thiserror = "1.0"
anyhow = "1.0"

# 4. Cryptography (پایه): برای امضاها و هش‌ها
sha3 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# 5. Logging: برای دیباگ کردن در محیط‌های توزیع‌شده
tracing = "0.1"
tracing-subscriber = "0.3"




